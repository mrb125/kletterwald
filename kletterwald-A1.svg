<?xml version="1.0" encoding="UTF-8"?>
<!-- Kletterwald DIN A1 Querformat (841 x 594 mm), Maßstab 1 LE = 1 cm = 10 mm -->
<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="594mm" viewBox="0 0 841 594">
  <defs>
    <style>
      .grid-sub  { stroke:#edf3eb; stroke-width:0.12; fill:none; }
      .grid-min  { stroke:#bcd4b6; stroke-width:0.25; fill:none; }
      .grid-maj  { stroke:#7aa874; stroke-width:0.45; fill:none; }
      .grid-bold { stroke:#3f7a3a; stroke-width:0.8;  fill:none; }
      .axis      { stroke:#1a3a1a; stroke-width:1.2; fill:none; }
      .tick      { font: 4.5px 'Helvetica', sans-serif; fill:#1a3a1a; }
      .tick-bold { font: 6px 'Helvetica', sans-serif; font-weight:bold; fill:#1a3a1a; }
      .tick0     { font: 6px 'Helvetica', sans-serif; font-weight:bold; fill:#1a3a1a; }
      .baum      { fill:#2e6b2e; stroke:#1a3a1a; stroke-width:0.7; }
      .baum-hi   { fill:#c44; stroke:#1a3a1a; stroke-width:0.7; }
      .label     { font: 7px 'Helvetica', sans-serif; font-weight:bold; fill:#1a3a1a; }
      .sublabel  { font: 4.5px 'Helvetica', sans-serif; fill:#444; }
      .name      { font: 5px 'Helvetica', sans-serif; font-style:italic; fill:#1a3a1a; }
      .title     { font: 14px 'Helvetica', sans-serif; font-weight:bold; fill:#1a3a1a; }
      .subtitle  { font: 8px 'Helvetica', sans-serif; fill:#335533; }
      .legend    { font: 7.5px 'Helvetica', sans-serif; fill:#1a3a1a; }
      .scalebar  { stroke:#1a3a1a; stroke-width:1.2; fill:none; }
      .scaletext { font: 7px 'Helvetica', sans-serif; font-weight:bold; fill:#1a3a1a; }
      .druckhinw { font: 8px 'Helvetica', sans-serif; font-weight:bold; fill:#a30000; }
    </style>
    <pattern id="sub" width="1"  height="1"  patternUnits="userSpaceOnUse"><path d="M 1 0 L 0 0 0 1"   class="grid-sub"/></pattern>
    <pattern id="min" width="5"  height="5"  patternUnits="userSpaceOnUse"><path d="M 5 0 L 0 0 0 5"   class="grid-min"/></pattern>
    <pattern id="maj" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" class="grid-maj"/></pattern>
  </defs>

  <rect x="0" y="0" width="841" height="594" fill="white"/>

  <text x="25" y="22" class="title">Kletterwald — Koordinatensystem DIN A1 (1 LE = 1 cm)</text>
  <text x="25" y="34" class="subtitle">8 Plattformen mit Namen · x: −38 … +38 · y: −26 … +26 · z = Spießlänge (1 LE Spieß = 1 cm)</text>
  <text x="25" y="46" class="druckhinw">DRUCKEN: A1 Querformat, „Tatsächliche Größe / 100 %“ — niemals „an Seite anpassen“! · 1 LE auf dem Lineal = exakt 1 cm</text>

  <g transform="translate(420.5, 305)">
    <!-- Plot 760 x 520 mm: x ∈ [-380, 380], y ∈ [-260, 260] -->
    <rect x="-380" y="-260" width="760" height="520" fill="url(#sub)"/>
    <rect x="-380" y="-260" width="760" height="520" fill="url(#min)"/>
    <rect x="-380" y="-260" width="760" height="520" fill="url(#maj)"/>

    <!-- 5-LE-Bold-Linien (alle 50 mm) -->
    <g>
      <!-- x = ±5, ±10, ±15, ±20, ±25, ±30, ±35 -->
      <line x1="-350" y1="-260" x2="-350" y2="260" class="grid-bold"/>
      <line x1="-300" y1="-260" x2="-300" y2="260" class="grid-bold"/>
      <line x1="-250" y1="-260" x2="-250" y2="260" class="grid-bold"/>
      <line x1="-200" y1="-260" x2="-200" y2="260" class="grid-bold"/>
      <line x1="-150" y1="-260" x2="-150" y2="260" class="grid-bold"/>
      <line x1="-100" y1="-260" x2="-100" y2="260" class="grid-bold"/>
      <line x1="-50"  y1="-260" x2="-50"  y2="260" class="grid-bold"/>
      <line x1="50"   y1="-260" x2="50"   y2="260" class="grid-bold"/>
      <line x1="100"  y1="-260" x2="100"  y2="260" class="grid-bold"/>
      <line x1="150"  y1="-260" x2="150"  y2="260" class="grid-bold"/>
      <line x1="200"  y1="-260" x2="200"  y2="260" class="grid-bold"/>
      <line x1="250"  y1="-260" x2="250"  y2="260" class="grid-bold"/>
      <line x1="300"  y1="-260" x2="300"  y2="260" class="grid-bold"/>
      <line x1="350"  y1="-260" x2="350"  y2="260" class="grid-bold"/>
      <!-- y = ±5, ±10, ±15, ±20, ±25 -->
      <line x1="-380" y1="-250" x2="380" y2="-250" class="grid-bold"/>
      <line x1="-380" y1="-200" x2="380" y2="-200" class="grid-bold"/>
      <line x1="-380" y1="-150" x2="380" y2="-150" class="grid-bold"/>
      <line x1="-380" y1="-100" x2="380" y2="-100" class="grid-bold"/>
      <line x1="-380" y1="-50"  x2="380" y2="-50"  class="grid-bold"/>
      <line x1="-380" y1="50"   x2="380" y2="50"   class="grid-bold"/>
      <line x1="-380" y1="100"  x2="380" y2="100"  class="grid-bold"/>
      <line x1="-380" y1="150"  x2="380" y2="150"  class="grid-bold"/>
      <line x1="-380" y1="200"  x2="380" y2="200"  class="grid-bold"/>
      <line x1="-380" y1="250"  x2="380" y2="250"  class="grid-bold"/>
    </g>

    <rect x="-380" y="-260" width="760" height="520" fill="none" stroke="#1a3a1a" stroke-width="0.6"/>

    <line x1="-390" y1="0" x2="390" y2="0" class="axis"/>
    <line x1="0" y1="270" x2="0" y2="-270" class="axis"/>
    <polygon points="390,0 384,-2.5 384,2.5" fill="#1a3a1a"/>
    <polygon points="0,-270 -2.5,-264 2.5,-264" fill="#1a3a1a"/>
    <text x="395" y="3" class="label">x</text>
    <text x="-5" y="-272" class="label">y</text>

    <!-- x-Beschriftung: alle 5 LE fett, dazwischen je 1 LE klein -->
    <g>
      <text x="-350" y="9" class="tick-bold" text-anchor="middle">−35</text>
      <text x="-300" y="9" class="tick-bold" text-anchor="middle">−30</text>
      <text x="-250" y="9" class="tick-bold" text-anchor="middle">−25</text>
      <text x="-200" y="9" class="tick-bold" text-anchor="middle">−20</text>
      <text x="-150" y="9" class="tick-bold" text-anchor="middle">−15</text>
      <text x="-100" y="9" class="tick-bold" text-anchor="middle">−10</text>
      <text x="-50"  y="9" class="tick-bold" text-anchor="middle">−5</text>
      <text x="50"   y="9" class="tick-bold" text-anchor="middle">5</text>
      <text x="100"  y="9" class="tick-bold" text-anchor="middle">10</text>
      <text x="150"  y="9" class="tick-bold" text-anchor="middle">15</text>
      <text x="200"  y="9" class="tick-bold" text-anchor="middle">20</text>
      <text x="250"  y="9" class="tick-bold" text-anchor="middle">25</text>
      <text x="300"  y="9" class="tick-bold" text-anchor="middle">30</text>
      <text x="350"  y="9" class="tick-bold" text-anchor="middle">35</text>
    </g>
    <!-- Feine x-Ticks (jede 1 LE als Strich) -->
    <g stroke="#1a3a1a" stroke-width="0.4">
      <line x1="-380" y1="-1.5" x2="-380" y2="1.5"/><line x1="-370" y1="-1.5" x2="-370" y2="1.5"/><line x1="-360" y1="-1.5" x2="-360" y2="1.5"/>
      <line x1="-340" y1="-1.5" x2="-340" y2="1.5"/><line x1="-330" y1="-1.5" x2="-330" y2="1.5"/><line x1="-320" y1="-1.5" x2="-320" y2="1.5"/><line x1="-310" y1="-1.5" x2="-310" y2="1.5"/>
      <line x1="-290" y1="-1.5" x2="-290" y2="1.5"/><line x1="-280" y1="-1.5" x2="-280" y2="1.5"/><line x1="-270" y1="-1.5" x2="-270" y2="1.5"/><line x1="-260" y1="-1.5" x2="-260" y2="1.5"/>
      <line x1="-240" y1="-1.5" x2="-240" y2="1.5"/><line x1="-230" y1="-1.5" x2="-230" y2="1.5"/><line x1="-220" y1="-1.5" x2="-220" y2="1.5"/><line x1="-210" y1="-1.5" x2="-210" y2="1.5"/>
      <line x1="-190" y1="-1.5" x2="-190" y2="1.5"/><line x1="-180" y1="-1.5" x2="-180" y2="1.5"/><line x1="-170" y1="-1.5" x2="-170" y2="1.5"/><line x1="-160" y1="-1.5" x2="-160" y2="1.5"/>
      <line x1="-140" y1="-1.5" x2="-140" y2="1.5"/><line x1="-130" y1="-1.5" x2="-130" y2="1.5"/><line x1="-120" y1="-1.5" x2="-120" y2="1.5"/><line x1="-110" y1="-1.5" x2="-110" y2="1.5"/>
      <line x1="-90" y1="-1.5" x2="-90" y2="1.5"/><line x1="-80" y1="-1.5" x2="-80" y2="1.5"/><line x1="-70" y1="-1.5" x2="-70" y2="1.5"/><line x1="-60" y1="-1.5" x2="-60" y2="1.5"/>
      <line x1="-40" y1="-1.5" x2="-40" y2="1.5"/><line x1="-30" y1="-1.5" x2="-30" y2="1.5"/><line x1="-20" y1="-1.5" x2="-20" y2="1.5"/><line x1="-10" y1="-1.5" x2="-10" y2="1.5"/>
      <line x1="10" y1="-1.5" x2="10" y2="1.5"/><line x1="20" y1="-1.5" x2="20" y2="1.5"/><line x1="30" y1="-1.5" x2="30" y2="1.5"/><line x1="40" y1="-1.5" x2="40" y2="1.5"/>
      <line x1="60" y1="-1.5" x2="60" y2="1.5"/><line x1="70" y1="-1.5" x2="70" y2="1.5"/><line x1="80" y1="-1.5" x2="80" y2="1.5"/><line x1="90" y1="-1.5" x2="90" y2="1.5"/>
      <line x1="110" y1="-1.5" x2="110" y2="1.5"/><line x1="120" y1="-1.5" x2="120" y2="1.5"/><line x1="130" y1="-1.5" x2="130" y2="1.5"/><line x1="140" y1="-1.5" x2="140" y2="1.5"/>
      <line x1="160" y1="-1.5" x2="160" y2="1.5"/><line x1="170" y1="-1.5" x2="170" y2="1.5"/><line x1="180" y1="-1.5" x2="180" y2="1.5"/><line x1="190" y1="-1.5" x2="190" y2="1.5"/>
      <line x1="210" y1="-1.5" x2="210" y2="1.5"/><line x1="220" y1="-1.5" x2="220" y2="1.5"/><line x1="230" y1="-1.5" x2="230" y2="1.5"/><line x1="240" y1="-1.5" x2="240" y2="1.5"/>
      <line x1="260" y1="-1.5" x2="260" y2="1.5"/><line x1="270" y1="-1.5" x2="270" y2="1.5"/><line x1="280" y1="-1.5" x2="280" y2="1.5"/><line x1="290" y1="-1.5" x2="290" y2="1.5"/>
      <line x1="310" y1="-1.5" x2="310" y2="1.5"/><line x1="320" y1="-1.5" x2="320" y2="1.5"/><line x1="330" y1="-1.5" x2="330" y2="1.5"/><line x1="340" y1="-1.5" x2="340" y2="1.5"/>
      <line x1="360" y1="-1.5" x2="360" y2="1.5"/><line x1="370" y1="-1.5" x2="370" y2="1.5"/><line x1="380" y1="-1.5" x2="380" y2="1.5"/>
    </g>

    <!-- y-Beschriftung (alle 5 LE) -->
    <g>
      <text x="-3" y="-247" class="tick-bold" text-anchor="end">25</text>
      <text x="-3" y="-197" class="tick-bold" text-anchor="end">20</text>
      <text x="-3" y="-147" class="tick-bold" text-anchor="end">15</text>
      <text x="-3" y="-97"  class="tick-bold" text-anchor="end">10</text>
      <text x="-3" y="-47"  class="tick-bold" text-anchor="end">5</text>
      <text x="-3" y="53"   class="tick-bold" text-anchor="end">−5</text>
      <text x="-3" y="103"  class="tick-bold" text-anchor="end">−10</text>
      <text x="-3" y="153"  class="tick-bold" text-anchor="end">−15</text>
      <text x="-3" y="203"  class="tick-bold" text-anchor="end">−20</text>
      <text x="-3" y="253"  class="tick-bold" text-anchor="end">−25</text>
    </g>
    <text x="-3" y="9" class="tick0" text-anchor="end">0</text>

    <!-- 8 Plattformen: SVG = (x*10, -y*10) mm -->
    <g transform="translate(-40,30)"><circle r="3" class="baum"/><text x="5" y="-3" class="label">B</text><text x="5" y="3" class="name">Basislager</text><text x="5" y="9" class="sublabel">(−4|−3|2)</text></g>
    <g transform="translate(-70,-30)"><circle r="3" class="baum"/><text x="5" y="-3" class="label">E</text><text x="5" y="3" class="name">Eichenturm</text><text x="5" y="9" class="sublabel">(−7|3|3)</text></g>
    <g transform="translate(-10,-70)"><circle r="3" class="baum"/><text x="5" y="-3" class="label">F</text><text x="5" y="3" class="name">Fuchsbau</text><text x="5" y="9" class="sublabel">(−1|7|5)</text></g>
    <g transform="translate(30,0)"><circle r="3" class="baum"/><text x="5" y="-3" class="label">W</text><text x="5" y="3" class="name">Wurzelhütte</text><text x="5" y="9" class="sublabel">(3|0|2)</text></g>
    <g transform="translate(50,40)"><circle r="3" class="baum"/><text x="5" y="-3" class="label">R</text><text x="5" y="3" class="name">Rabenfels</text><text x="5" y="9" class="sublabel">(5|−4|4)</text></g>
    <g transform="translate(10,-20)"><circle r="3.7" class="baum-hi"/><text x="6" y="-3" class="label">A</text><text x="6" y="3" class="name">Adlerhorst</text><text x="6" y="9" class="sublabel">(1|2|6)</text></g>
    <g transform="translate(20,-10)"><circle r="3" class="baum"/><text x="-6" y="-2" class="label" text-anchor="end">S</text><text x="-6" y="4" class="name" text-anchor="end">Spechtnest</text><text x="-6" y="10" class="sublabel" text-anchor="end">(2|1|4)</text></g>
    <g transform="translate(80,-50)"><circle r="3.7" class="baum-hi"/><text x="6" y="-3" class="label">G</text><text x="6" y="3" class="name">Gipfelstation</text><text x="6" y="9" class="sublabel">(8|5|6)</text></g>
  </g>

  <!-- Maßstab unten links -->
  <g transform="translate(35, 560)">
    <line x1="0" y1="0" x2="10" y2="0" class="scalebar"/>
    <line x1="0" y1="-3" x2="0" y2="3" class="scalebar"/>
    <line x1="10" y1="-3" x2="10" y2="3" class="scalebar"/>
    <text x="5" y="-5" class="scaletext" text-anchor="middle">1 LE</text>
    <text x="5" y="12" class="scaletext" text-anchor="middle">1 cm</text>
    <line x1="40" y1="0" x2="90" y2="0" class="scalebar"/>
    <line x1="40" y1="-3" x2="40" y2="3" class="scalebar"/>
    <line x1="90" y1="-3" x2="90" y2="3" class="scalebar"/>
    <text x="65" y="-5" class="scaletext" text-anchor="middle">5 LE</text>
    <text x="65" y="12" class="scaletext" text-anchor="middle">5 cm</text>
    <line x1="120" y1="0" x2="220" y2="0" class="scalebar"/>
    <line x1="120" y1="-3" x2="120" y2="3" class="scalebar"/>
    <line x1="220" y1="-3" x2="220" y2="3" class="scalebar"/>
    <text x="170" y="-5" class="scaletext" text-anchor="middle">10 LE</text>
    <text x="170" y="12" class="scaletext" text-anchor="middle">10 cm</text>
  </g>

  <g transform="translate(540, 560)">
    <circle cx="0" cy="-2" r="3" class="baum"/>
    <text x="7" y="0" class="legend">Plattform (Spießlänge in cm = z-Wert)</text>
    <circle cx="160" cy="-2" r="3.7" class="baum-hi"/>
    <text x="169" y="0" class="legend">hohe Plattform (Adlerhorst, Gipfelstation)</text>
  </g>

  <g transform="translate(620, 30)">
    <line x1="0" y1="0" x2="20" y2="0" class="grid-sub"/>
    <text x="24" y="2" class="legend">1 mm = 0,1 LE</text>
    <line x1="100" y1="0" x2="120" y2="0" class="grid-min"/>
    <text x="124" y="2" class="legend">5 mm = 0,5 LE</text>
    <line x1="0" y1="14" x2="20" y2="14" class="grid-maj"/>
    <text x="24" y="16" class="legend">10 mm = 1 LE</text>
    <line x1="100" y1="14" x2="120" y2="14" class="grid-bold"/>
    <text x="124" y="16" class="legend">50 mm = 5 LE</text>
  </g>
</svg>
